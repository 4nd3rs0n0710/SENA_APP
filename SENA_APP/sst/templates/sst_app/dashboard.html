{% extends 'sst_app/base.html' %}

{% block content %}
<h3 class="text-xl font-semibold text-gray-800 mb-4">Panel de Control</h3>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
    <div class="bg-emerald-100 p-6 rounded-lg shadow-md flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-600 mr-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <div>
            <p class="text-gray-500 text-sm font-medium">Total de Documentos</p>
            <p class="text-2xl font-bold text-gray-900">{{ total_documentos }}</p>
        </div>
    </div>
    <div class="bg-red-100 p-6 rounded-lg shadow-md flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-600 mr-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <div>
            <p class="text-gray-500 text-sm font-medium">Incidentes Reportados</p>
            <p class="text-2xl font-bold text-gray-900">{{ total_incidentes }}</p>
        </div>
    </div>
    <div class="bg-blue-100 p-6 rounded-lg shadow-md flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600 mr-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <line x1="10" y1="9" x2="8" y2="9"></line>
        </svg>
        <div>
            <p class="text-gray-500 text-sm font-medium">Inspecciones Pendientes</p>
            <p class="text-2xl font-bold text-gray-900">{{ inspecciones_pendientes }}</p>
        </div>
    </div>
</div>
{% endblock %}
