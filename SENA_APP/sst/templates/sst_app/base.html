<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo SST - Centro Minero</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .tab-button.active {
            background-color: #f9fafb;
            color: #10b981;
            border-bottom: 2px solid #10b981;
        }
        /* Clases de color para los tipos de riesgo */
        .color-bajo { background-color: #34d399; }
        .color-medio { background-color: #fcd34d; }
        .color-alto { background-color: #fb923c; }
        .color-critico { background-color: #ef4444; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Contenedor principal del módulo -->
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

        <!-- Tarjeta principal del módulo SST -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            
            <!-- Cabecera del módulo -->
            <div class="p-6 bg-emerald-600 text-white shadow-md">
                <h2 class="text-2xl sm:text-3xl font-bold flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                    Módulo SST - Centro de Formación Minero
                </h2>
            </div>

            <!-- Navegación de pestañas -->
            <div class="border-b border-gray-200">
                <nav class="flex flex-col sm:flex-row -mb-px" role="tablist" aria-label="Tabs del módulo SST">
                    <a href="{% url 'sst_app:dashboard' %}" class="tab-button flex-1 py-4 px-6 text-center text-sm font-medium text-gray-700 hover:text-emerald-600 focus:outline-none transition duration-150 ease-in-out border-b-2 border-transparent hover:border-gray-300 {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 inline-block sm:hidden" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                        </svg>
                        Dashboard
                    </a>
                    <a href="{% url 'sst_app:documentos' %}" class="tab-button flex-1 py-4 px-6 text-center text-sm font-medium text-gray-700 hover:text-emerald-600 focus:outline-none transition duration-150 ease-in-out border-b-2 border-transparent hover:border-gray-300 {% if request.resolver_match.url_name == 'documentos' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 inline-block sm:hidden" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586a2 2 0 011.414.586l4.414 4.414a2 2 0 01.586 1.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" />
                        </svg>
                        Documentos
                    </a>
                    <a href="{% url 'sst_app:inspecciones' %}" class="tab-button flex-1 py-4 px-6 text-center text-sm font-medium text-gray-700 hover:text-emerald-600 focus:outline-none transition duration-150 ease-in-out border-b-2 border-transparent hover:border-gray-300 {% if request.resolver_match.url_name == 'inspecciones' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 inline-block sm:hidden" viewBox="0 0 20 20" fill="CurrentColor">
                            <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" />
                            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h1a3 3 0 003-3 2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 5a1 1 0 000 2h6a1 1 0 100-2H7zm1 4a1 1 0 100 2h4a1 1 0 100-2H8z" clip-rule="evenodd" />
                        </svg>
                        Inspecciones
                    </a>
                    <a href="{% url 'sst_app:incidentes' %}" class="tab-button flex-1 py-4 px-6 text-center text-sm font-medium text-gray-700 hover:text-emerald-600 focus:outline-none transition duration-150 ease-in-out border-b-2 border-transparent hover:border-gray-300 {% if request.resolver_match.url_name == 'incidentes' %}active{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 inline-block sm:hidden" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                        Reporte de Incidentes
                    </a>
                </nav>
            </div>

            <!-- Contenido de las pestañas -->
            <div class="p-6">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <script>
        // Función para actualizar el color del indicador de riesgo
        function updateRiskColor() {
            const select = document.getElementById('id_nivel_riesgo');
            const indicator = document.getElementById('risk-color-indicator');
            
            if (select && indicator) {
                const value = select.value;
                indicator.className = 'w-6 h-6 ml-4 rounded-full shadow-md';
                
                if (value === 'BAJO') {
                    indicator.classList.add('color-bajo');
                } else if (value === 'MEDIO') {
                    indicator.classList.add('color-medio');
                } else if (value === 'ALTO') {
                    indicator.classList.add('color-alto');
                } else if (value === 'CRITICO') {
                    indicator.classList.add('color-critico');
                }
            }
        }

        // Inicializar cuando el documento esté listo
        document.addEventListener('DOMContentLoaded', function() {
            updateRiskColor();
            
            // Agregar evento change al selector de riesgo
            const riskSelect = document.getElementById('id_nivel_riesgo');
            if (riskSelect) {
                riskSelect.addEventListener('change', updateRiskColor);
            }
        });
    </script>
</body>
</html>
